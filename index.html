<script>
// Reiniciar música cuando el usuario haga clic en cualquier parte
document.addEventListener('DOMContentLoaded', function() {
    var audio = document.querySelector('.song-audio-autoplay');
    var musicImg = document.querySelector('img[src*="music.png"]');
    
    // Reproducir automáticamente al cargar
    audio.play().catch(function() {
        // Si falla, esperar interacción
        document.body.addEventListener('click', function() {
            audio.currentTime = 0;
            audio.play();
            musicImg.classList.add('rotateImages');
        }, { once: true });
    });
    
    // Opcional: reiniciar también al hacer clic en el cuerpo de la página
    document.body.addEventListener('click', function(e) {
        // Solo si no se hizo clic en el icono de música
        if (!e.target.closest('img[src*="music.png"]')) {
            audio.currentTime = 0;
            audio.play();
            musicImg.classList.add('rotateImages');
        }
    });
});

// Función para copiar al portapapeles
function copyToClipboard(elementId) {
    var text = document.getElementById(elementId).textContent;
    navigator.clipboard.writeText(text).then(function() {
        var btn = event.target;
        var originalText = btn.textContent;
        btn.textContent = '¡Copiado!';
        btn.style.background = '#4CAF50';
        
        setTimeout(function() {
            btn.textContent = originalText;
            btn.style.background = '#ff6b6b';
        }, 2000);
    }).catch(function(err) {
        console.error('Error al copiar: ', err);
    });
}

// Mostrar/ocultar información del servidor
document.getElementById('surprise-button').addEventListener('click', function() {
    var serverInfo = document.getElementById('server-info');
    if (serverInfo.style.display === 'block') {
        serverInfo.style.display = 'none';
        this.textContent = '♥️ una sorpresita más';
    } else {
        serverInfo.style.display = 'block';
        this.textContent = '♥️ Cerrar sorpresa';
    }
});
</script>

<script>
    (function () {
        var canvas = $('#canvas');

        if (!canvas[0].getContext) {
            $("#error").show();
            return false;
        }

        var width = canvas.width();
        var height = canvas.height();

        canvas.attr("width", width);
        canvas.attr("height", height);

        var opts = {
            seed: {
                x: width / 2 - 20,
                color: "rgb(190, 26, 37)",
                scale: 2
            },
            branch: [
                [535, 680, 570, 250, 500, 200, 30, 100, [
                    [540, 500, 455, 417, 340, 400, 13, 100, [
                        [450, 435, 434, 430, 394, 395, 2, 40]
                    ]],
                    [550, 445, 600, 356, 680, 345, 12, 100, [
                        [578, 400, 648, 409, 661, 426, 3, 80]
                    ]],
                    [539, 281, 537, 248, 534, 217, 3, 40],
                    [546, 397, 413, 247, 328, 244, 9, 80, [
                        [427, 286, 383, 253, 371, 205, 2, 40],
                        [498, 345, 435, 315, 395, 330, 4, 60]
                    ]],
                    [546, 357, 608, 252, 678, 221, 6, 100, [
                        [590, 293, 646, 277, 648, 271, 2, 80]
                    ]]
                ]]
            ],
            bloom: {
                num: 700,
                width: 1080,
                height: 650,
            },
            footer: {
                width: 1200,
                height: 5,
                speed: 10,
            }
        }

        var tree = new Tree(canvas[0], width, height, opts);
        var seed = tree.seed;
        var foot = tree.footer;
        var hold = 1;

        canvas.click(function (e) {
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            if (seed.hover(x, y)) {
                hold = 0;
                canvas.unbind("click");
                canvas.unbind("mousemove");
                canvas.removeClass('hand');
            }
        }).mousemove(function (e) {
            var offset = canvas.offset(), x, y;
            x = e.pageX - offset.left;
            y = e.pageY - offset.top;
            canvas.toggleClass('hand', seed.hover(x, y));
        });

        var seedAnimate = eval(Jscex.compile("async", function () {
            seed.draw();
            while (hold) {
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canScale()) {
                seed.scale(0.95);
                $await(Jscex.Async.sleep(10));
            }
            while (seed.canMove()) {
                seed.move(0, 2);
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
        }));

        var growAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.grow();
                $await(Jscex.Async.sleep(10));
            } while (tree.canGrow());
        }));

        var flowAnimate = eval(Jscex.compile("async", function () {
            do {
                tree.flower(2);
                $await(Jscex.Async.sleep(10));
            } while (tree.canFlower());
        }));

        var moveAnimate = eval(Jscex.compile("async", function () {
            tree.snapshot("p1", 240, 0, 610, 680);
            while (tree.move("p1", 500, 0)) {
                foot.draw();
                $await(Jscex.Async.sleep(10));
            }
            foot.draw();
            tree.snapshot("p2", 500, 0, 610, 680);

            // 会有闪烁不得意这样做, (＞﹏＜)
            canvas.parent().css("background", "url(" + tree.toDataURL('image/png') + ")");
            canvas.css("background", "#ffe");
            $await(Jscex.Async.sleep(300));
            canvas.css("background", "none");
        }));

        // MODIFICADO: jumpAnimate ahora se ejecuta por un tiempo limitado
        var jumpAnimate = eval(Jscex.compile("async", function () {
            var ctx = tree.ctx;
            // Ejecutar por 10 segundos (10000ms) en lugar de infinito
            var jumpDuration = 10000; // 10 segundos
            var startTime = new Date().getTime();
            
            while ((new Date().getTime() - startTime) < jumpDuration) {
                tree.ctx.clearRect(0, 0, width, height);
                tree.jump();
                foot.draw();
                $await(Jscex.Async.sleep(25));
            }
            
            // Después de 10 segundos, detener la animación
            // Limpiar el canvas para que quede estático
            tree.ctx.clearRect(0, 0, width, height);
            // Dibujar el estado final del árbol
            tree.drawStatic();
        }));

        var textAnimate = eval(Jscex.compile("async", function () {
            var together = new Date(config.date);

            $("#code").show().typewriter();
            $("#clock-box").fadeIn(500);
            while (true) {
                timeElapse(together);
                $await(Jscex.Async.sleep(1000));
            }
        }));

        // Función para mostrar el botón de sorpresa
        var showSurpriseButton = eval(Jscex.compile("async", function () {
            // Esperar un poco más después de jumpAnimate
            $await(Jscex.Async.sleep(1000));
            
            // Mostrar el botón con animación
            var button = document.getElementById('surprise-button');
            button.style.display = 'block';
            button.style.opacity = '0';
            button.style.transform = 'translateY(20px)';
            
            // Animación de aparición
            $await(Jscex.Async.sleep(300));
            button.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
            button.style.opacity = '1';
            button.style.transform = 'translateY(0)';
            
            // También mostrar un mensaje sutil
            console.log("¡Animación completada! Haz clic en el botón para ver la sorpresa.");
        }));

        var runAsync = eval(Jscex.compile("async", function () {
            $await(seedAnimate());
            $await(growAnimate());
            $await(flowAnimate());
            $await(moveAnimate());

            textAnimate().start(); // Esto se ejecuta en paralelo
            
            $await(jumpAnimate()); // Ahora esto termina después de 10 segundos
            
            // Mostrar el botón después de que todo termine
            showSurpriseButton().start();
        }));

        runAsync().start();
    })();
    // Solución de emergencia: mostrar el botón después de 30 segundos
setTimeout(function() {
    var button = document.getElementById('surprise-button');
    if (button) {
        button.style.display = 'block';
        button.style.opacity = '0';
        
        setTimeout(function() {
            button.style.transition = 'opacity 1s ease';
            button.style.opacity = '1';
        }, 100);
        
        // Hacer que parpadee
        var blinkCount = 0;
        var blinkInterval = setInterval(function() {
            button.style.background = blinkCount % 2 === 0 ? 
                'linear-gradient(45deg, #ff6b6b, #ee5a24)' : 
                'linear-gradient(45deg, #ff8e8e, #ff7f3a)';
            blinkCount++;
            if (blinkCount > 6) clearInterval(blinkInterval);
        }, 500);
    }
}, 65000); // 65 segundos
</script>
